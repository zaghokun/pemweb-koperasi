{{define "title"}}Masuk — Koperasi Karyawan Sejahtera{{end}}

{{define "content"}}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-primary mb-1">Koperasi Sejahtera</h3>
                    <p class="text-muted small">Masuk dengan akun pengurus koperasi</p>
                </div>

                {{if .Error}}
                <div class="alert alert-danger small py-2">{{.Error}}</div>
                {{end}}

                <form method="POST" action="/login">
                    <input type="hidden" name="_csrf" value="{{.CSRFToken}}">

                    <div class="mb-3">
                        <label for="username" class="form-label small fw-semibold">Username</label>
                        <input type="text" class="form-control" id="username" name="username" value="{{.Username}}" required autofocus autocomplete="username">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label small fw-semibold">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Masuk</button>
                </form>
            </div>
        </div>
    </div>
</div>
{{end}}
